version: 2

updates:
  # npm dependencies. Every version in package.json is pinned exactly, so an
  # update is always a real, reviewable change rather than a range that already
  # moved underneath the lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    commit-message:
      prefix: Update
    groups:
      # The framework and its renderer move together; splitting them produces
      # pull requests that cannot pass CI on their own.
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # Test and lint tooling, where a batch is easier to review than a queue of
      # near-identical patch bumps.
      tooling:
        dependency-type: development
        patterns:
          - 'vitest'
          - '@vitejs/*'
          - '@testing-library/*'
          - '@playwright/*'
          - 'eslint*'
          - 'prettier*'
          - 'typescript'
          - 'jsdom'
          - 'fake-indexeddb'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'

  # The workflow's own actions, which nothing else would ever prompt us to move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Update
